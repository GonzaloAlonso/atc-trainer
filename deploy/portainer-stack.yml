# ATC Trainer — Portainer stack (Stacks → Add stack → Web editor).
# Runs behind an existing Caddy container on the external "proxy" network; no host ports.
# Set VISOR_ADMIN_PASSWORD (and optionally OpenSky credentials and ANTHROPIC_API_KEY for the AI
# coach's debriefs) under "Environment variables".
# The image is private: add ghcr.io under Portainer "Registries" (GitHub user + read:packages token).
# ":2.1" follows the 2.1.x patch releases; pin an exact version (e.g. ":2.1.0") to hold one.
# The container, service and volume keep their "visor" names: Caddy proxies to visor:8000 and the
# data (recordings, accounts, coaching sessions) stays in the existing volume.
# © 2026 Gonzalo Alonso. All rights reserved.
services:
  visor:
    image: ghcr.io/gonzaloalonso/atc-trainer:2.1
    container_name: visor
    restart: unless-stopped
    networks:
      - proxy
    environment:
      VISOR_ADMIN_USER: ${VISOR_ADMIN_USER:-admin}
      VISOR_ADMIN_PASSWORD: ${VISOR_ADMIN_PASSWORD:-}
      VISOR_COOKIE_SECURE: "true"      # always served over HTTPS by Caddy
      VISOR_TRUST_PROXY: "1"           # real client IP from Caddy's X-Forwarded-For
      VISOR_IDLE_SLEEP_MIN: ${VISOR_IDLE_SLEEP_MIN:-5}   # nobody online -> simulation sleeps (0 = never)
      VISOR_MAX_SANDBOXES: ${VISOR_MAX_SANDBOXES:-20}   # tutorial / exercise sessions at once
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}          # AI coach debriefs and answers (optional)
      VISOR_COACH_MODEL: ${VISOR_COACH_MODEL:-claude-opus-5-5}
      OPENSKY_CLIENT_ID: ${OPENSKY_CLIENT_ID:-}
      OPENSKY_CLIENT_SECRET: ${OPENSKY_CLIENT_SECRET:-}
    volumes:
      - visor-data:/data               # recordings, user accounts, coaching sessions

volumes:
  visor-data:

networks:
  proxy:
    external: true
