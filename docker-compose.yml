services:
  visor:
    build: .
    # Set VISOR_IMAGE (e.g. ghcr.io/gonzaloalonso/atc-trainer:2.1) to run a published release instead of
    # building locally: `docker compose pull && docker compose up -d`.
    image: ${VISOR_IMAGE:-visor-atc:latest}
    restart: unless-stopped
    # Bound to localhost: publish it through a reverse proxy (nginx, Caddy, ...) with TLS.
    # Use "8000:8000" to expose it directly (then sign-in happens over plain HTTP).
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # First start only (empty user table): the admin account to create. Leave the password
      # empty to get a generated one in `docker compose logs` (it must be changed at first login).
      VISOR_ADMIN_USER: ${VISOR_ADMIN_USER:-admin}
      VISOR_ADMIN_PASSWORD: ${VISOR_ADMIN_PASSWORD:-}
      VISOR_SESSION_HOURS: ${VISOR_SESSION_HOURS:-168}
      VISOR_COOKIE_SECURE: ${VISOR_COOKIE_SECURE:-auto}
      VISOR_IDLE_SLEEP_MIN: ${VISOR_IDLE_SLEEP_MIN:-5}    # nobody online -> simulation sleeps (0 = never)
      VISOR_MAX_SANDBOXES: ${VISOR_MAX_SANDBOXES:-20}     # tutorial / exercise sessions at once
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}            # AI coach debriefs and answers (optional)
      VISOR_COACH_MODEL: ${VISOR_COACH_MODEL:-claude-opus-5-5}
      OPENSKY_CLIENT_ID: ${OPENSKY_CLIENT_ID:-}
      OPENSKY_CLIENT_SECRET: ${OPENSKY_CLIENT_SECRET:-}
      JEV_ENDPOINT: ${JEV_ENDPOINT:-}
      JEV_API_KEY: ${JEV_API_KEY:-}
      JEV_MODEL: ${JEV_MODEL:-}
    volumes:
      - visor-data:/data

volumes:
  visor-data:
