<!doctype html>
<html lang="en" class="i18n-pending">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="author" content="Gonzalo Alonso" />
  <meta name="copyright" content="© 2026 Gonzalo Alonso. All rights reserved." />
  <title>ATC Trainer · Users</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body class="page">
  <header id="top" class="page-top">
    <div class="brand"><span class="logo"></span>ATC<span class="sub">TRAINER</span></div>
    <a href="/" class="nav-link" data-i18n="admin.back">← Working position</a>
    <div class="spacer"></div>
    <span id="me" class="dim"></span>
    <button id="logout" class="ghost-btn" data-i18n="admin.logout">Sign out</button>
  </header>

  <main class="admin">
    <section class="card-lg">
      <div class="section-head">
        <h1 data-i18n="admin.users">Users</h1>
        <span id="count" class="dim"></span>
      </div>
      <div class="table-wrap">
        <table class="users">
          <thead>
            <tr><th data-i18n="admin.username">Username</th><th data-i18n="admin.role">Role</th><th data-i18n="admin.status">Status</th><th data-i18n="admin.tutorial">Tutorial</th><th data-i18n="admin.coach">Coach</th><th data-i18n="admin.lastLogin">Last sign-in</th><th data-i18n="admin.created">Created</th><th></th></tr>
          </thead>
          <tbody id="users"></tbody>
        </table>
      </div>
    </section>

    <section class="card-lg">
      <h2 data-i18n="admin.add">Add user</h2>
      <form id="add-form" class="row-form" autocomplete="off">
        <label><span data-i18n="admin.username">Username</span> <input id="add-username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_.\-]{3,32}" /></label>
        <label><span data-i18n="admin.initial">Initial password</span> <input id="add-password" type="password" required minlength="10" autocomplete="new-password" /></label>
        <label><span data-i18n="admin.role">Role</span>
          <select id="add-role"><option value="controller" data-i18n="admin.roleController">Controller</option><option value="admin" data-i18n="admin.roleAdmin">Admin</option></select>
        </label>
        <label class="check"><input id="add-must-change" type="checkbox" checked /> <span data-i18n="admin.mustChange">Must change at first sign-in</span></label>
        <button class="primary" type="submit" data-i18n="admin.add">Add user</button>
      </form>
      <p class="hint" data-i18n="admin.addHint">Controllers can use the working position, the coach and the exercises. Admins can also manage users.</p>
    </section>
  </main>
  <footer class="page-footer">© 2026 Gonzalo Alonso. All rights reserved.</footer>

  <dialog id="pw-dialog" class="dialog">
    <form method="dialog" id="pw-form" class="stack">
      <h2 id="pw-title"></h2>
      <label><span data-i18n="admin.pwNew">New password</span> <input id="pw-new" type="password" minlength="10" required autocomplete="new-password" /></label>
      <label class="check"><input id="pw-must-change" type="checkbox" checked /> <span data-i18n="admin.pwMust">Must change at next sign-in</span></label>
      <p class="hint" data-i18n="admin.pwHint">The user is signed out everywhere.</p>
      <p id="pw-error" class="form-error"></p>
      <div class="dialog-actions">
        <button type="button" id="pw-cancel" class="ghost-btn" data-i18n="admin.cancel">Cancel</button>
        <button type="submit" class="primary" data-i18n="admin.pwSet">Set password</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="hidden"></div>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
